<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía de Inteligencia Artificial</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#14213d;--mut:#586178;--line:#d9deea;--acc:#1f4fd8;--accfg:#fff;--gb:#dcf4e4;--gf:#0f6a33;--fb:#fdefc2;--ff:#774f00;--pb:#fddcdc;--pf:#a01919;--ib:#dae6ff;--if:#1a43ad;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1220;--card:#151d31;--ink:#e8ecf7;--mut:#9aa5bf;--line:#26314d;--acc:#6f95ff;--accfg:#0c1220;--gb:#12351f;--gf:#7fe0a4;--fb:#3a2f0b;--ff:#f2cf72;--pb:#3d1717;--pf:#ff9a9a;--ib:#162a55;--if:#9bbcff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1220;--card:#151d31;--ink:#e8ecf7;--mut:#9aa5bf;--line:#26314d;--acc:#6f95ff;--accfg:#0c1220;--gb:#12351f;--gf:#7fe0a4;--fb:#3a2f0b;--ff:#f2cf72;--pb:#3d1717;--pf:#ff9a9a;--ib:#162a55;--if:#9bbcff}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:clamp(26px,5vw,40px);line-height:1.1;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 16px;max-width:60ch}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.tabs button{border-radius:8px;font-weight:600}
input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin:4px 0 8px}
.n{color:var(--mut);font-size:14px;margin:6px 0}
h2{font-size:21px;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h3{font-size:17px;margin:0}
.card a{color:var(--acc);text-decoration:none}
.card a:hover{text-decoration:underline}
.b{align-self:flex-start;font-size:12px;font-weight:700;padding:2px 9px;border-radius:6px}
.g{background:var(--gb);color:var(--gf)}.f{background:var(--fb);color:var(--ff)}.p{background:var(--pb);color:var(--pf)}.i{background:var(--ib);color:var(--if)}
.pr{color:var(--mut);font-size:13px}
.id{font-size:14.5px}
.w{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
th{background:var(--acc);color:var(--accfg)}
tr:last-child td{border-bottom:0}
.pf{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.pf h3{margin:0 0 4px;font-size:18px}.pf b{color:var(--acc)}.pf p{margin:4px 0 0;color:var(--mut)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--acc)}}
</style>
</head>

const s={v:'h',c:-1,t:'',q:''};
const $=id=>document.getElementById(id);
const norm=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function chips(){
  $('tabs').innerHTML=[['h','Herramientas'],['c','Gratis vs. pago'],['r','Por perfil']].map(([k,l])=>`<button data-v="${k}" class="${s.v===k?'on':''}">${l}</button>`).join('');
  $('tools').style.display=s.v==='h'?'':'none';
  $('cats').innerHTML=`<button data-c="-1" class="${s.c<0?'on':''}">Todas</button>`+D.map((d,i)=>`<button data-c="${i}" class="${s.c===i?'on':''}">${d[0]} ${d[1]}</button>`).join('');
  $('typ').innerHTML=`<button data-t="" class="${s.t===''?'on':''}">Todos los precios</button>`+Object.keys(T).map(k=>`<button data-t="${k}" class="${s.t===k?'on':''}">${T[k][0]}</button>`).join('');
}
function card(t){
  const [n,ty,pr,id,u]=t;
  return `<div class="card"><h3><a href="https://${u}" target="_blank" rel="noopener">${n}</a></h3><span class="b ${T[ty][1]}">${T[ty][0]}</span><span class="pr">${pr}</span><span class="id"><b>Ideal para:</b> ${id}</span></div>`;
}
function res(){
  const r=$('res');
  if(s.v==='c'){r.innerHTML=`<h2>Gratis vs. pago</h2><p class="sub">Para cada tarea, la opción de pago más recomendada y su mejor alternativa gratuita.</p><div class="w"><table><tr><th>Tarea</th><th>Recomendada (de pago)</th><th>Alternativa gratuita</th></tr>${CMP.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</table></div>`;return}
  if(s.v==='r'){r.innerHTML=`<h2>Recomendaciones por perfil</h2>`+PRF.map(p=>`<div class="pf" style="border-left-color:${p[3]}"><h3>${p[0]}</h3><b>${p[1]}</b><p>${p[2]}</p></div>`).join('');return}
  const q=norm(s.q.trim());let n=0,h='';
  D.forEach((d,i)=>{
    if(s.c>=0&&s.c!==i)return;
    const ts=d[2].filter(t=>(!s.t||t[1]===s.t)&&(!q||norm(t[0]+' '+t[3]+' '+t[2]).includes(q)));
    if(!ts.length)return;n+=ts.length;
    h+=`<h2>${d[0]} ${d[1]}</h2><div class="grid">${ts.map(card).join('')}</div>`;
  });
  r.innerHTML=n?`<p class="n">${n} herramienta${n===1?'':'s'}</p>${h}`:'<p class="n">Sin resultados. Prueba otra palabra o quita los filtros.</p>';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.v){s.v=b.dataset.v}
  else if(b.dataset.c!==undefined){s.c=+b.dataset.c}
  else if(b.dataset.t!==undefined){s.t=b.dataset.t}
  else return;
  chips();res();
});
